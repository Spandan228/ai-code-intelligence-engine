[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-intelligence-engine"
version = "2.0.0"
description = "An enterprise-grade developer intelligence platform for multi-language AST parsing, dense vector semantic search, interactive dependency topology, and automated code quality auditing."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Spandan Swarup Nanda", email = "spandanswapunanda@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "code-intelligence",
    "ast-parsing",
    "tree-sitter",
    "semantic-search",
    "faiss",
    "vector-search",
    "dependency-graph",
    "static-analysis",
    "fastapi",
    "streamlit"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "streamlit>=1.30.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-java>=0.20.0",
    "tree-sitter-c>=0.20.0",
    "tree-sitter-cpp>=0.20.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "networkx>=3.0",
    "plotly>=5.15.0",
    "radon>=6.0.1",
    "GitPython>=3.1.30",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=6.0.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0"
]

[project.urls]
Homepage = "https://github.com/Spandan228/ai-code-intelligence-engine"
Documentation = "https://github.com/Spandan228/ai-code-intelligence-engine#readme"
Repository = "https://github.com/Spandan228/ai-code-intelligence-engine.git"
Issues = "https://github.com/Spandan228/ai-code-intelligence-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ai_explainer*",
    "analysis*",
    "api*",
    "dependency_graph*",
    "indexer*",
    "navigation*",
    "parsers*",
    "refactoring*",
    "search*",
    "ui*",
    "utils*",
    "vector_store*"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
